[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outerloop-science"
dynamic = ["version"]
description = "Autonomous research agent that co-develops the lab's benchmark-bearing repos"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Agentic Learning AI Lab, New York University" }]
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

# Deps are added with the code that needs them (see docs/roadmap.md). Planned:
#   github   : PyGithub or gh-CLI wrappers
#   compute  : (stdlib subprocess over sbatch/squeue; no dep expected)

[project.scripts]
outerloop = "outerloop.cli:main"

[project.optional-dependencies]
# GitHub App auth: RS256 signing for App JWTs (docs/design/github-app-auth.md).
# Install where AUTORESEARCH_GITHUB_APP_FILE is set; the PAT path needs nothing.
app-auth = ["cryptography>=42"]

[dependency-groups]
dev = [
    "cryptography>=42",  # the app-auth signer, so tests exercise real RS256
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8",
    "pre-commit>=4",
]

[project.urls]
Homepage = "https://outerloop.science"
Repository = "https://github.com/outerloop-science/outerloop"
Changelog = "https://github.com/outerloop-science/outerloop/blob/main/CHANGELOG.md"
Issues = "https://github.com/outerloop-science/outerloop/issues"

[tool.hatch.version]
path = "src/outerloop/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/outerloop"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E731", "SIM108"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow and not llm and not slurm'"
markers = [
    "slow: long-running; nightly/manual only",
    "llm: calls a paid LLM API; manual only, never CI",
    "slurm: needs a Slurm cluster; manual only, never CI",
]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/web"]

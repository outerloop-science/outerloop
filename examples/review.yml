# Outerloop advisory reviewer — drop this into your repo at
# .github/workflows/review.yml to get an AI code review on every pull request.
#
# It posts advisory findings as a PR review. It NEVER approves, never blocks
# your CI, and never fails your build. The session runs on an ephemeral
# runner: it may run code while investigating, but its only secret is the
# reviewer's model key, and the write token lives in a separate posting job.
# It reviews pull requests from branches in THIS repository; PRs from forks
# are skipped. The model key lives only in the read-only session job.
#
# Setup (see docs/reviewer.md): (1) have a bot account whose PRs are skipped,
# (2) add this file, (3) set the OPENAI_REVIEWER_KEY repo secret.
name: outerloop-review
on:
  pull_request_target:
    # first round when a PR opens; re-review by (re)applying the label below
    types: [opened, reopened, labeled]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    if: >-
      github.event.action != 'labeled'
      || github.event.label.name == 'outerloop:review'
    # Track the v0 release tag: maintainers move it to each final release, never
    # on a push to main, so the code that receives your reviewer key changes only
    # with a release. Keep reviewer_ref on the same ref. A tag trusts whoever
    # can push tags here; for code that cannot change under you, pin a full
    # commit SHA in both places instead. Never a branch.
    uses: outerloop-science/outerloop/.github/workflows/advisory-review-agent.yml@v0
    with:
      reviewer_ref: v0
      # PRs authored by this login are never reviewed (so the bot never
      # reviews its own PRs). Use your own bot/app login.
      bot_login: your-bot-login
      # set it when the kernel runs with your own token (personal mode)
      # personal: true
      # backend: codex (default) | claude | hermes. Codex runs on the model
      # this release pins unless you set `model`; claude needs `model`.
    secrets:
      openai_reviewer_key: ${{ secrets.OPENAI_REVIEWER_KEY }}

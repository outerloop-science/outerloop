# Reusable agent-session reviewer — ONE workflow, any backend, always the
# least-token split. Target repos call this with `uses:` and never vendor the
# reviewer code. A standing reviewer is one caller job; a second opinion is
# another caller job with a different backend/model/opinion label.
#
# Topology (every backend, claude included):
#   session job — READ-ONLY permissions. Checks out the PR head (never
#     executed), runs the review session, emits raw findings (or a skip-stub
#     marker) as an artifact. The only secrets present are the session's own
#     model key and read-scoped tokens (job token + the reviewer repo's
#     read-only deploy key while private) — nothing worth stealing, so even
#     backends that can read /proc are safe here: the ephemeral runner plus
#     this tokenless split is the boundary (the judge holds a shell to run the
#     verdict syscall tool; roles differ by prompt, not tool posture).
#   post job — holds pull-requests:write, runs NO model session. Re-validates
#     the envelope (right PR, bot/opt-out skip re-checked, sanitizing render)
#     and posts through the normal advisory path with the reviewer named in
#     the round stamp.
#
# Constraints: never reviews bot-authored PRs, never approves, never fails
# the caller's CI, same-repo PRs only. By design: the "Round N" counter is
# shared across all opinions on a PR (the number is cosmetic; the stamp names
# the reviewer), and a missing/expired backend key posts a could-not-run stub
# naming its opinion label on each triggering PR until fixed — the noise IS the
# warning.
name: advisory-review-agent

on:
  workflow_call:
    inputs:
      bot_login:
        description: Login of your bot account — its PRs are never reviewed. Required.
        type: string
        required: true
      backend:
        description: Review backend (claude | hermes | codex).
        type: string
        required: false
        default: claude
      model:
        description: >-
          Model for the session. Empty uses the backend default
          (claude-opus-5 for claude; the backend's own default otherwise).
          For hermes pass an OpenRouter id — except with
          hermes_provider: openai, which REQUIRES the provider-native id
          (gpt-5.6-terra, no openai/ prefix).
        type: string
        required: false
        default: ''
      hermes_provider:
        description: >-
          Credential provider for the hermes backend: openrouter (default) or
          openai — openai-direct uses OPENAI_REVIEWER_KEY, avoids the
          OpenRouter platform fee, and takes provider-NATIVE model ids
          (gpt-5.6-terra, no openai/ prefix).
        type: string
        required: false
        default: openrouter
      opinion_label:
        description: >-
          Label shown on the posted round (who this opinion is). Leave empty
          for the primary reviewer.
        type: string
        required: false
        default: ''
      opinion_id:
        description: >-
          Slug distinguishing this opinion's artifact and concurrency group when
          a caller runs the SAME backend twice (two models). Defaults to the
          backend name.
        type: string
        required: false
        default: ''
      lens:
        description: >-
          Named attention lens for the session (wide first round —
          docs/design/reviewer-infra.md); empty reviews with the full rubric.
        type: string
        required: false
        default: ''
      post:
        description: >-
          Post the round from this call. false = emit-only (a lens opinion
          whose artifact a summarizer merges and posts instead).
        type: boolean
        required: false
        default: true
      reviewer_repo:
        description: Repo holding the reviewer (change this if you forked).
        type: string
        required: false
        default: agentic-learning-ai-lab/autoresearch
      reviewer_ref:
        description: >-
          Ref of the reviewer to run. Pin to a tag or SHA in production —
          but a ref older than the least-token split lacks emit support and
          will silently stop posting under this topology; pin nothing older.
        type: string
        required: false
        default: main
    secrets:
      anthropic_reviewer_key:
        description: Anthropic key for the claude backend.
        required: false
      openrouter_api_key:
        description: OpenRouter key for the hermes backend (default provider).
        required: false
      openai_reviewer_key:
        description: >-
          OpenAI key, shared by the codex backend and hermes with
          hermes_provider: openai — one org key, two backends; only the
          selected session's tree ever sees it.
        required: false
      checkout_ssh_key:
        description: >-
          Read-only deploy key for the reviewer repo. Needed while that repo is
          PRIVATE (the caller's token cannot read another private repo); omit
          once it is public.
        required: false

# The caller grants this much; each job below narrows it further.
permissions:
  contents: read
  pull-requests: write

# One review per opinion per PR at a time. Do NOT cancel in progress: a running
# session is a paid model call, so queue behind it rather than kill it.
concurrency:
  group: advisory-review-agent-${{ inputs.opinion_id || inputs.backend }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    # Advisory means advisory: an infrastructure failure here must never turn
    # the caller's PR red. (Failures still show in this job's run log.)
    continue-on-error: true
    # Backstop a hung session so it can't burn the 360-min default runner budget.
    timeout-minutes: 70
    # Fork PRs must not reach any secret. `pull_request_target` runs in the
    # base repo's context, so this gate is what closes the pwn-request hole.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # READ-ONLY: the session runs here, so the job token must not be worth
    # stealing. pull-requests:read lets the CLI fetch the PR metadata/diff.
    permissions:
      contents: read
      pull-requests: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BACKEND: ${{ inputs.backend }}
      HERMES_REF: v2026.8.13
      # the COMMIT sha for HERMES_REF (the tag is annotated: ls-remote's first
      # line is the tag object — pin the dereferenced ^{} commit instead)
      HERMES_SHA: f80f453ae0679347e38abc917c7f94f717bf96c5
    steps:
      # Checks out the reviewer, never the pull request's code for execution.
      # An empty ssh-key is ignored by actions/checkout (token auth is enough
      # for a public or same-repo reviewer); a private reviewer repo needs it.
      - name: Check out the reviewer
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.reviewer_repo }}
          ref: ${{ inputs.reviewer_ref }}
          ssh-key: ${{ secrets.checkout_ssh_key }}
          path: .autoresearch
          persist-credentials: false
      - name: Check out the PR head (read-only; never executed)
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          path: pr-head
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: .autoresearch/uv.lock
      # Cache scope: this workflow runs on pull_request_target, so every run —
      # any PR — executes in the BASE branch context and shares ONE cache
      # scope. One round populates it; every later round hits. Cold is only
      # the first run on a fresh HERMES_REF (or 7-day eviction).
      - name: Restore the hermes clone
        id: hermes-cache
        if: inputs.backend == 'hermes'
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/hermes-agent
          key: hermes-agent-${{ env.HERMES_REF }}
      # Pinned artifacts, same discipline across backends: claude installer
      # pin, codex npm pin, hermes release tag. Bump deliberately.
      - name: Install the ${{ inputs.backend }} backend
        run: |
          set -euo pipefail
          case "$BACKEND" in
            codex)
              npm install -g @openai/codex@0.130.0
              ;;
            hermes)
              verify_hermes() {
                [ -d "$GITHUB_WORKSPACE/hermes-agent/.git" ] &&
                  [ "$(git -C "$GITHUB_WORKSPACE/hermes-agent" rev-parse HEAD 2>/dev/null)" = "$HERMES_SHA" ] &&
                  [ -z "$(git -C "$GITHUB_WORKSPACE/hermes-agent" status --porcelain 2>/dev/null)" ]
              }
              if verify_hermes; then
                echo "hermes-agent restored from cache (pinned sha verified)"
              else
                # cold cache, or a restore failing the sha/clean check — an
                # unverified tree never runs with the reviewer key. Clone
                # fresh, ANONYMOUSLY — deliberately: the job's GITHUB_TOKEN
                # is a repo-scoped installation token, and git-over-HTTP
                # 401s a foreign-repo credential outright (observed live,
                # jepa-agent#11: "could not read Username" x6 — git tries to
                # prompt after the reject). For a public foreign repo,
                # anonymous succeeds where the token cannot; the cache keeps
                # this to one clone per repo per version, and the retry
                # rides out the anonymous rate limit on a cold fan-out.
                rm -rf "$GITHUB_WORKSPACE/hermes-agent"
                for i in 1 2 3 4 5 6; do
                  if git clone --depth 1 --branch "$HERMES_REF" \
                      https://github.com/NousResearch/hermes-agent \
                      "$GITHUB_WORKSPACE/hermes-agent"; then
                    break
                  fi
                  if [ "$i" = 6 ]; then
                    echo "hermes clone failed after 6 attempts" >&2
                    exit 0  # advisory: the CLI's missing-repo stub surfaces it
                  fi
                  sleep $(( i * 10 + RANDOM % 10 ))
                  rm -rf "$GITHUB_WORKSPACE/hermes-agent"
                done
                if ! verify_hermes; then
                  # a moved tag or dirty clone must never run with the key
                  echo "hermes-agent does not match pinned sha $HERMES_SHA — refusing" >&2
                  rm -rf "$GITHUB_WORKSPACE/hermes-agent"
                  exit 0  # advisory: the missing-repo stub surfaces it
                fi
              fi
              ;;
            claude)
              curl -fsSL https://claude.ai/install.sh | bash -s -- 2.1.229
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
              ;;
            *)
              echo "unsupported review backend: $BACKEND" >&2
              exit 0  # advisory: never red the caller's CI
              ;;
          esac
      # Save BEFORE the session step, never post-job: the cache is shared by
      # every future run (base-branch scope), so it must only ever hold the
      # pristine verified clone — a post-job save would persist whatever the
      # session left in the workspace into a tree later runs EXECUTE with the
      # reviewer key (cache poisoning). Immutability then works for us: the
      # first save wins and nothing can overwrite it.
      - name: Save the pristine hermes clone
        if: inputs.backend == 'hermes' && steps.hermes-cache.outputs.cache-hit != 'true' && hashFiles('hermes-agent/**') != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/hermes-agent
          key: hermes-agent-${{ env.HERMES_REF }}
      - name: Run the session (emit only — nothing posted from this job)
        working-directory: .autoresearch
        env:
          REVIEW_BACKEND: ${{ inputs.backend }}
          REVIEW_MODEL: ${{ inputs.model }}
          # ONLY the chosen backend's key enters the session process tree: a
          # shell/file-reading backend must not be able to lift a sibling
          # backend's key via /proc (terra's blocking finding, #94 round 1)
          # ... and for hermes the key follows the PROVIDER: an openai-direct
          # session gets only the OpenAI key, an openrouter session only the
          # OpenRouter key.
          ANTHROPIC_REVIEWER_KEY: ${{ inputs.backend == 'claude' && secrets.anthropic_reviewer_key || '' }}
          OPENROUTER_API_KEY: ${{ inputs.backend == 'hermes' && inputs.hermes_provider != 'openai' && secrets.openrouter_api_key || '' }}
          OPENAI_REVIEWER_KEY: ${{ (inputs.backend == 'codex' || (inputs.backend == 'hermes' && inputs.hermes_provider == 'openai')) && secrets.openai_reviewer_key || '' }}
          # hermes reads its pinned clone from here; provider seeds ~/.hermes.
          REVIEW_HERMES_REPO: ${{ github.workspace }}/hermes-agent
          REVIEW_HERMES_PROVIDER: ${{ inputs.hermes_provider }}
          # read-only job token: PR metadata/diff fetch only
          GITHUB_TOKEN: ${{ github.token }}
          PR_REPO: ${{ github.repository }}
          REVIEW_BOT_LOGIN: ${{ inputs.bot_login }}
          REVIEW_CHECKOUT: ${{ github.workspace }}/pr-head
          REVIEW_LENS: ${{ inputs.lens }}
          REVIEW_EMIT_FILE: ${{ runner.temp }}/findings.json
        run: uv run python -m autoresearch.review_agent_cli
      - name: Backstop envelope
        # Runs only when the CLI exited 0 (default step semantics): a
        # reviewer_ref pinned BEFORE envelope-on-every-outcome writes nothing
        # on a clean skip, which would hard-fail the post job's required
        # download on every bot PR. A crashed session exits nonzero, skips
        # this step, and still fails loudly downstream. The backstop is a
        # skip-STUB, not skip-clean: the poster's own skip re-check silences
        # it on bot/opt-out PRs (the pinned-ref clean-skip case), while a
        # session that went silent on a human PR posts a visible
        # could-not-run round instead of being relabeled a quiet day.
        working-directory: .autoresearch
        env:
          PR_REPO: ${{ github.repository }}
          EMIT_FILE: ${{ runner.temp }}/findings.json
        run: |
          if [ ! -f "$EMIT_FILE" ]; then
            uv run python -c "import json, os, pathlib; pathlib.Path(os.environ['EMIT_FILE']).write_text(json.dumps({'repo': os.environ['PR_REPO'], 'number': int(os.environ['PR_NUMBER']), 'kind': 'skip-stub', 'detail': 'session wrote no envelope (reviewer_ref predates envelope emission, or the session went silent)'}))"
          fi
      - name: Upload findings
        # not `success()`: a session step that died AFTER emitting must still
        # deliver its findings (or its skip-stub) to the posting job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: review-findings-${{ inputs.opinion_id || inputs.backend }}-${{ env.PR_NUMBER }}
          path: ${{ runner.temp }}/findings.json
          if-no-files-found: ignore
          retention-days: 3

  post:
    runs-on: ubuntu-latest
    needs: session
    # inputs.post=false -> emit-only: a lens opinion whose artifact the
    # summarizer merges; nothing is posted from this call.
    if: ${{ inputs.post && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    continue-on-error: true
    timeout-minutes: 15
    # The write half: no model session runs in this job.
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out the reviewer
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.reviewer_repo }}
          ref: ${{ inputs.reviewer_ref }}
          ssh-key: ${{ secrets.checkout_ssh_key }}
          path: .autoresearch
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: .autoresearch/uv.lock
      - name: Download findings
        id: findings
        # NO continue-on-error: every session outcome uploads an envelope
        # (findings / skip-stub / skip-clean), so a missing artifact means
        # the session died before emitting — fail this job visibly (the
        # caller's PR stays green; the job is continue-on-error at job
        # level). Observed live 2026-08-15: errored terra sessions posted
        # nothing and read as quiet clean days.
        uses: actions/download-artifact@v4
        with:
          name: review-findings-${{ inputs.opinion_id || inputs.backend }}-${{ env.PR_NUMBER }}
          path: ${{ runner.temp }}
      - name: Post the findings
        if: steps.findings.outcome == 'success'
        working-directory: .autoresearch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          REVIEW_BOT_LOGIN: ${{ inputs.bot_login }}
          REVIEW_EMIT_FILE: ${{ runner.temp }}/findings.json
          REVIEW_OPINION_LABEL: ${{ inputs.opinion_label }}
        run: uv run python -m autoresearch.review_post_cli

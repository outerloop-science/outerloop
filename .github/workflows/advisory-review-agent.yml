# Reusable agent-session reviewer — ONE workflow, any backend, always the
# least-token split. Target repos call this with `uses:` and never vendor the
# reviewer code. A standing reviewer is one caller job; a second opinion is
# another caller job with a different backend/model/opinion label.
#
# Topology (every backend, claude included):
#   session job — READ-ONLY permissions. Checks out the PR head (never
#     executed), runs the review session, emits raw findings (or a skip-stub
#     marker) as an artifact. The only secrets present are the session's own
#     model key and read-scoped tokens (job token + the reviewer repo's
#     read-only deploy key while private) — nothing worth stealing, so even
#     backends that can read /proc (codex: shell; hermes: file tool) are safe
#     here. Claude's native read-only tool set and /proc-safe Read remain
#     defense in depth rather than load-bearing.
#   post job — holds pull-requests:write, runs NO model session. Re-validates
#     the envelope (right PR, bot/opt-out skip re-checked, sanitizing render)
#     and posts through the normal advisory path with the reviewer named in
#     the round stamp.
#
# Constraints: never reviews bot-authored PRs, never approves, never fails
# the caller's CI, same-repo PRs only. By design: the "Round N" counter is
# shared across all opinions on a PR (the number is cosmetic; the stamp names
# the reviewer), and a missing/expired backend key posts a could-not-run stub
# naming its opinion label on each triggering PR until fixed — the noise IS the
# warning.
name: advisory-review-agent

on:
  workflow_call:
    inputs:
      bot_login:
        description: Login of your bot account — its PRs are never reviewed. Required.
        type: string
        required: true
      backend:
        description: Review backend (claude | hermes | codex).
        type: string
        required: false
        default: claude
      model:
        description: >-
          Model for the session. Empty uses the backend default
          (claude-opus-5 for claude; the backend's own default otherwise).
          For hermes pass an OpenRouter id.
        type: string
        required: false
        default: ''
      opinion_label:
        description: >-
          Label shown on the posted round (who this opinion is). Leave empty
          for the primary reviewer.
        type: string
        required: false
        default: ''
      opinion_id:
        description: >-
          Slug distinguishing this opinion's artifact and concurrency group when
          a caller runs the SAME backend twice (two models). Defaults to the
          backend name.
        type: string
        required: false
        default: ''
      reviewer_repo:
        description: Repo holding the reviewer (change this if you forked).
        type: string
        required: false
        default: agentic-learning-ai-lab/autoresearch
      reviewer_ref:
        description: Ref of the reviewer to run. Pin to a tag or SHA in production.
        type: string
        required: false
        default: main
    secrets:
      anthropic_reviewer_key:
        description: Anthropic key for the claude backend.
        required: false
      openrouter_api_key:
        description: OpenRouter key for the hermes backend.
        required: false
      openai_reviewer_key:
        description: OpenAI key for the codex backend.
        required: false
      checkout_ssh_key:
        description: >-
          Read-only deploy key for the reviewer repo. Needed while that repo is
          PRIVATE (the caller's token cannot read another private repo); omit
          once it is public.
        required: false

# The caller grants this much; each job below narrows it further.
permissions:
  contents: read
  pull-requests: write

# One review per opinion per PR at a time. Do NOT cancel in progress: a running
# session is a paid model call, so queue behind it rather than kill it.
concurrency:
  group: advisory-review-agent-${{ inputs.opinion_id || inputs.backend }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    # Advisory means advisory: an infrastructure failure here must never turn
    # the caller's PR red. (Failures still show in this job's run log.)
    continue-on-error: true
    # Backstop a hung session so it can't burn the 360-min default runner budget.
    timeout-minutes: 70
    # Fork PRs must not reach any secret. `pull_request_target` runs in the
    # base repo's context, so this gate is what closes the pwn-request hole.
    # The reviewer also never executes PR code, a second layer of defense.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # READ-ONLY: the session runs here, so the job token must not be worth
    # stealing. pull-requests:read lets the CLI fetch the PR metadata/diff.
    permissions:
      contents: read
      pull-requests: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BACKEND: ${{ inputs.backend }}
    steps:
      # Checks out the reviewer, never the pull request's code for execution.
      # An empty ssh-key is ignored by actions/checkout (token auth is enough
      # for a public or same-repo reviewer); a private reviewer repo needs it.
      - name: Check out the reviewer
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.reviewer_repo }}
          ref: ${{ inputs.reviewer_ref }}
          ssh-key: ${{ secrets.checkout_ssh_key }}
          path: .autoresearch
          persist-credentials: false
      - name: Check out the PR head (read-only; never executed)
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          path: pr-head
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: .autoresearch/uv.lock
      # Pinned artifacts, same discipline across backends: claude installer
      # pin, codex npm pin, hermes release tag. Bump deliberately.
      - name: Install the ${{ inputs.backend }} backend
        env:
          HERMES_REF: v2026.8.13
        run: |
          set -euo pipefail
          case "$BACKEND" in
            codex)
              npm install -g @openai/codex@0.130.0
              ;;
            hermes)
              git clone --depth 1 --branch "$HERMES_REF" \
                https://github.com/NousResearch/hermes-agent \
                "$GITHUB_WORKSPACE/hermes-agent"
              ;;
            claude)
              curl -fsSL https://claude.ai/install.sh | bash -s -- 2.1.229
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
              ;;
            *)
              echo "unsupported review backend: $BACKEND" >&2
              exit 0  # advisory: never red the caller's CI
              ;;
          esac
      - name: Run the session (emit only — nothing posted from this job)
        working-directory: .autoresearch
        env:
          REVIEW_BACKEND: ${{ inputs.backend }}
          REVIEW_MODEL: ${{ inputs.model }}
          # ONLY the chosen backend's key enters the session process tree: a
          # shell/file-reading backend must not be able to lift a sibling
          # backend's key via /proc (terra's blocking finding, #94 round 1)
          ANTHROPIC_REVIEWER_KEY: ${{ inputs.backend == 'claude' && secrets.anthropic_reviewer_key || '' }}
          OPENROUTER_API_KEY: ${{ inputs.backend == 'hermes' && secrets.openrouter_api_key || '' }}
          OPENAI_REVIEWER_KEY: ${{ inputs.backend == 'codex' && secrets.openai_reviewer_key || '' }}
          # codex's default bwrap can't init on GitHub-hosted; opt into
          # Landlock (read-only, no egress). Harmless for other backends.
          REVIEW_CODEX_LEGACY_LANDLOCK: ${{ inputs.backend == 'codex' && '1' || '' }}
          # hermes reads its pinned clone from here; provider seeds ~/.hermes.
          REVIEW_HERMES_REPO: ${{ github.workspace }}/hermes-agent
          REVIEW_HERMES_PROVIDER: openrouter
          # read-only job token: PR metadata/diff fetch only
          GITHUB_TOKEN: ${{ github.token }}
          PR_REPO: ${{ github.repository }}
          REVIEW_BOT_LOGIN: ${{ inputs.bot_login }}
          REVIEW_CHECKOUT: ${{ github.workspace }}/pr-head
          REVIEW_EMIT_FILE: ${{ runner.temp }}/findings.json
        run: uv run python -m autoresearch.review_agent_cli
      - name: Upload findings
        # not `success()`: a session step that died AFTER emitting must still
        # deliver its findings (or its skip-stub) to the posting job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: review-findings-${{ inputs.opinion_id || inputs.backend }}-${{ env.PR_NUMBER }}
          path: ${{ runner.temp }}/findings.json
          if-no-files-found: ignore
          retention-days: 3

  post:
    runs-on: ubuntu-latest
    needs: session
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    continue-on-error: true
    timeout-minutes: 15
    # The write half: no model session runs in this job.
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out the reviewer
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.reviewer_repo }}
          ref: ${{ inputs.reviewer_ref }}
          ssh-key: ${{ secrets.checkout_ssh_key }}
          path: .autoresearch
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: .autoresearch/uv.lock
      - name: Download findings
        id: findings
        continue-on-error: true  # no artifact = clean skip upstream
        uses: actions/download-artifact@v4
        with:
          name: review-findings-${{ inputs.opinion_id || inputs.backend }}-${{ env.PR_NUMBER }}
          path: ${{ runner.temp }}
      - name: Post the findings
        if: steps.findings.outcome == 'success'
        working-directory: .autoresearch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          REVIEW_BOT_LOGIN: ${{ inputs.bot_login }}
          REVIEW_EMIT_FILE: ${{ runner.temp }}/findings.json
          REVIEW_OPINION_LABEL: ${{ inputs.opinion_label }}
        run: uv run python -m autoresearch.review_post_cli

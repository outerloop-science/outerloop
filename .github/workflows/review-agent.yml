name: advisory-review-agent-manual
# Manual dispatch of the agent reviewer — the bench for exercising any backend
# on a chosen PR. Backends are interchangeable: every judge runs with a shell
# (it records its verdict via the installed syscall tool), contained by the
# ephemeral runner plus the tokenless split — roles differ by prompt, never by
# a per-backend tool posture (docs/design/role-cli.md).
# The PR-triggered production path is review.yml -> advisory-review-agent.yml.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        type: string
        required: true
      backend:
        description: Which agent backend drives the review
        type: choice
        options: [claude, codex, hermes]
        default: claude
      model:
        description: >-
          Model for the session. Empty -> the backend default (claude-opus-5,
          codex configured, hermes default). For hermes pass the PROVIDER'S
          native id (openrouter: deepseek/deepseek-chat; openai: gpt-5.6-terra).
        type: string
        required: false
        default: ''
      hermes_provider:
        description: hermes credential provider (openrouter | openai)
        type: choice
        options: [openrouter, openai]
        default: openrouter

permissions:
  contents: read
  pull-requests: write

# The bench gets its OWN group: experiments queue behind each other but
# never block (or get blocked by) a standing round. Racing a standing round
# only risks a cosmetic duplicate round number.
concurrency:
  group: advisory-review-bench-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  agent-review:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      BACKEND: ${{ inputs.backend }}
    steps:
      - name: Check out the reviewer
        uses: actions/checkout@v4
        with:
          path: .autoresearch
          persist-credentials: false
      - name: Check out the PR head (read-only; never executed)
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          path: pr-head
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: .autoresearch/uv.lock
      # Each backend ships as a pinned artifact, same discipline across the
      # three: codex npm pin, claude installer pin, hermes release tag.
      - name: Install the ${{ inputs.backend }} backend
        env:
          HERMES_REF: v2026.8.13
        run: |
          set -euo pipefail
          case "$BACKEND" in
            codex)
              npm install -g @openai/codex@0.130.0
              ;;
            hermes)
              git clone --depth 1 --branch "$HERMES_REF" \
                https://github.com/NousResearch/hermes-agent \
                "$GITHUB_WORKSPACE/hermes-agent"
              ;;
            *)
              curl -fsSL https://claude.ai/install.sh | bash -s -- 2.1.229
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
              ;;
          esac
      - name: Run the agent review
        working-directory: .autoresearch
        env:
          REVIEW_BACKEND: ${{ inputs.backend }}
          REVIEW_MODEL: ${{ inputs.model }}
          # one key per session tree, same rule as the reusable: a
          # file-reading backend must not be able to lift a sibling's key
          ANTHROPIC_REVIEWER_KEY: ${{ inputs.backend == 'claude' && secrets.ANTHROPIC_REVIEWER_KEY || '' }}
          OPENROUTER_API_KEY: ${{ inputs.backend == 'hermes' && inputs.hermes_provider != 'openai' && secrets.OPENROUTER_API_KEY || '' }}
          OPENAI_REVIEWER_KEY: ${{ (inputs.backend == 'codex' || (inputs.backend == 'hermes' && inputs.hermes_provider == 'openai')) && secrets.OPENAI_REVIEWER_KEY || '' }}
          # hermes reads its pinned clone from here; provider seeds ~/.hermes.
          REVIEW_HERMES_REPO: ${{ github.workspace }}/hermes-agent
          REVIEW_HERMES_PROVIDER: ${{ inputs.hermes_provider }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_BOT_LOGIN: agentic-learning-bot
          REVIEW_CHECKOUT: ${{ github.workspace }}/pr-head
        run: uv run python -m outerloop.review_agent_cli

name: advisory-review-agent-manual
# Manual dispatch of the agent reviewer — the bench for exercising any backend
# on a chosen PR. Backends are interchangeable: every judge runs with a shell
# (it records its verdict via the installed syscall tool), contained by the
# ephemeral runner plus the tokenless split — roles differ by prompt, never by
# a per-backend tool posture (docs/design/role-cli.md).
# The PR-triggered production path is review.yml -> advisory-review-agent.yml.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        type: string
        required: true
      backend:
        description: Which agent backend drives the review
        type: choice
        options: [claude, codex, hermes]
        default: claude
      model:
        description: >-
          Model for the session. The claude backend requires one: this input,
          else OUTERLOOP_CLAUDE_MODEL in the environment (no built-in default).
          Empty -> codex configured, hermes default. For hermes pass the
          PROVIDER'S native id (openrouter: deepseek/deepseek-chat; openai:
          gpt-5.6-terra).
        type: string
        required: false
        default: ''
      hermes_provider:
        description: hermes credential provider (openrouter | openai)
        type: choice
        options: [openrouter, openai]
        default: openrouter

permissions:
  contents: read
  pull-requests: write

# The bench gets its OWN group: experiments queue behind each other but
# never block (or get blocked by) a standing round. Racing a standing round
# only risks a cosmetic duplicate round number.
concurrency:
  group: advisory-review-bench-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  agent-review:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      BACKEND: ${{ inputs.backend }}
    steps:
      - name: Check out the reviewer
        uses: actions/checkout@v7
        with:
          path: .autoresearch
          persist-credentials: false
      - name: Check out the PR head (read-only; never executed)
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          path: pr-head
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: .autoresearch/uv.lock
      # Each backend ships as a pinned artifact, same discipline across the
      # three: codex npm pin, claude installer pin, hermes release tag.
      - name: Resolve harness pins
        shell: bash
        run: |
          set -euo pipefail
          reader=".autoresearch/src/outerloop/harness_pins.py"
          # Compatibility fallback for reviewer refs predating packaged pins:
          # refuse provisioning explicitly rather than use an empty/latest version.
          [ -f "$reader" ] || { echo "::error::Harness pins reader missing from reviewer ref; select a ref containing harness pins"; exit 1; }
          CLAUDE_VERSION=$(python3 "$reader" claude version) || { echo "::error::Cannot read Claude pin"; exit 1; }
          CODEX_VERSION=$(python3 "$reader" codex version) || { echo "::error::Cannot read Codex pin"; exit 1; }
          HERMES_REF=$(python3 "$reader" hermes ref) || { echo "::error::Cannot read Hermes ref"; exit 1; }
          HERMES_SHA=$(python3 "$reader" hermes sha) || { echo "::error::Cannot read Hermes SHA"; exit 1; }
          for key in CLAUDE_VERSION CODEX_VERSION HERMES_REF HERMES_SHA; do
            [ -n "${!key}" ] || { echo "::error::Empty harness pin: $key"; exit 1; }
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
          done
      - name: Install the ${{ inputs.backend }} backend
        run: |
          set -euo pipefail
          case "$BACKEND" in
            codex)
              npm install -g "@openai/codex@$CODEX_VERSION"
              ;;
            hermes)
              # The kernel checkout supplies the same installer used by local init.
              # It verifies both pins, retries anonymous clones, and builds the runtime.
              # advisory: a failed install must not turn CI red; the harness then
              # reports the missing runtime on the PR
              bash "$GITHUB_WORKSPACE/.autoresearch/scripts/install_hermes.sh" \
                "$GITHUB_WORKSPACE/hermes-agent" \
                || echo "hermes install failed; the review will report it" >&2
              ;;
            *)
              curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_VERSION"
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
              ;;
          esac
      - name: Run the agent review
        working-directory: .autoresearch
        env:
          REVIEW_BACKEND: ${{ inputs.backend }}
          REVIEW_MODEL: ${{ inputs.model }}
          OUTERLOOP_CLAUDE_MODEL: ${{ vars.OUTERLOOP_CLAUDE_MODEL }}
          # one key per session tree, same rule as the reusable: a
          # file-reading backend must not be able to lift a sibling's key
          ANTHROPIC_REVIEWER_KEY: ${{ inputs.backend == 'claude' && secrets.ANTHROPIC_REVIEWER_KEY || '' }}
          OPENROUTER_API_KEY: ${{ inputs.backend == 'hermes' && inputs.hermes_provider != 'openai' && secrets.OPENROUTER_API_KEY || '' }}
          OPENAI_REVIEWER_KEY: ${{ (inputs.backend == 'codex' || (inputs.backend == 'hermes' && inputs.hermes_provider == 'openai')) && secrets.OPENAI_REVIEWER_KEY || '' }}
          # hermes reads its pinned clone from here; provider seeds ~/.hermes.
          REVIEW_HERMES_REPO: ${{ github.workspace }}/hermes-agent
          REVIEW_HERMES_PROVIDER: ${{ inputs.hermes_provider }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_BOT_LOGIN: 'outerloop-science[bot]'
          REVIEW_CHECKOUT: ${{ github.workspace }}/pr-head
        run: uv run python -m outerloop.review_agent_cli

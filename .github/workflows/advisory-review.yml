# Reusable advisory-review workflow. Target repos call this with `uses:`;
# they never vendor the reviewer code. Constraints enforced here and in
# autoresearch.review: never reviews bot-authored PRs automatically (a
# maintainer-added re-request label overrides — an explicit human ask is
# not an echo chamber), never approves, never fails the caller's CI, and
# never runs with secrets on a fork PR.
name: advisory-review

on:
  workflow_call:
    inputs:
      bot_login:
        description: Login of your bot account — its PRs are never reviewed. Required.
        type: string
        required: true
      reviewer_repo:
        description: Repo holding the reviewer (change this if you forked).
        type: string
        required: false
        default: agentic-learning-ai-lab/autoresearch
      reviewer_ref:
        description: Ref of the reviewer to run. Pin to a tag or SHA in production.
        type: string
        required: false
        default: main
      model:
        type: string
        required: false
        default: claude-opus-5
      effort:
        type: string
        required: false
        default: high
      review_bot_prs_on_label:
        description: >-
          Self-hosters WITHOUT a verifier deployment may set true so an
          explicit re-request label reviews bot PRs with the advisory
          reviewer. Leave false when the verifier is deployed — the label
          then routes bot PRs to it instead (docs/design/roles.md).
        type: boolean
        required: false
        default: false
    secrets:
      reviewer_api_key:
        required: true
      checkout_ssh_key:
        description: >-
          Read-only deploy key for the reviewer repo. Only needed while that
          repo is PRIVATE (the caller's token cannot read another private
          repo); omit entirely once it is public.
        required: false

permissions:
  contents: read
  pull-requests: write

# One review at a time per PR: a second push must not race the first into a
# duplicate comment (or a duplicate model bill).
concurrency:
  group: advisory-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Advisory means advisory: an infrastructure failure here must never turn
    # the caller's PR red.
    continue-on-error: true
    # Fork PRs must not reach the secret. `pull_request_target` runs in the
    # base repo's context, so this gate is what closes the pwn-request hole.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Checks out the REVIEWER, never the pull request's code. Nothing from
      # the PR is executed at any point. An empty ssh-key is ignored by
      # actions/checkout (token auth, enough for a public or same-repo
      # reviewer); a private reviewer repo needs the read-only deploy key.
      # (`secrets` is not a valid context in step-level `if:` — do not split
      # this into conditional steps.)
      - name: Check out the reviewer
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.reviewer_repo }}
          ref: ${{ inputs.reviewer_ref }}
          ssh-key: ${{ secrets.checkout_ssh_key }}
          path: .autoresearch
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run advisory review
        working-directory: .autoresearch
        env:
          ANTHROPIC_REVIEWER_KEY: ${{ secrets.reviewer_api_key }}
          # The caller's own workflow token — the bot PAT is never used here.
          GITHUB_TOKEN: ${{ github.token }}
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_BOT_LOGIN: ${{ inputs.bot_login }}
          REVIEW_MODEL: ${{ inputs.model }}
          REVIEW_EFFORT: ${{ inputs.effort }}
          # The caller's triggering event flows through workflow_call. The
          # override requires opting in (verifier-less self-hosters only),
          # the SPECIFIC re-request label (any-label would defeat the
          # bot-skip via unrelated triage labels), and a labeler who is NOT
          # the PR's author — "the author must not unlock review of its own
          # work". Scope honestly stated: accounts with triage access are
          # trusted per GitHub's own permission model; this guard only
          # stops self-unlocking. With a verifier deployed, the label
          # routes bot PRs there and this stays false.
          REVIEW_EXPLICIT_REQUEST: ${{ inputs.review_bot_prs_on_label && github.event.action == 'labeled' && github.event.label.name == 'autoresearch:review' && github.event.sender.login != github.event.pull_request.user.login }}
        run: uv run --extra review python -m autoresearch.review_cli
